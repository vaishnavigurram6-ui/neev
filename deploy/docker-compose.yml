# Local proof of the single-service Cloud Run layout, before spending a deploy.
#
# Cloud Run runs every container of a service in ONE network namespace, so a
# sidecar is reachable at 127.0.0.1 and never from the internet. Compose has no
# direct equivalent, but `network_mode: service:api` gives exactly that: `web`
# joins `api`'s namespace, both see each other on loopback, and only the port
# published on `api` is exposed. What runs here is what runs there.
#
# Which container "owns" the namespace is a Compose artefact with no Cloud Run
# counterpart. `api` owns it because `web` must wait for it to be healthy, and
# having the waiter own the namespace would make the dependency circular.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8080
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # NOT $PORT=8080: the ingress container has that. A sidecar is addressed
      # by whatever port it is told to listen on, and the frontend is told the
      # same number through NEEV_API_BASE below.
      PORT: "8000"
      NEEV_MODE: "fixture"
      NEEV_DEMO_AUTH: "true"
      NEEV_SESSION_SECRET: "local-proof-only-never-deployed"
    # The frontend's port, published from the namespace both containers share.
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ../src/frontend
    network_mode: "service:api"
    environment:
      PORT: "8080"
      # The whole point: server-to-server over loopback. lib/api.ts is
      # `server-only`, so this address is never inlined into a client bundle
      # and the browser cannot reach the backend even in principle.
      NEEV_API_BASE: "http://127.0.0.1:8000"
    depends_on:
      api:
        condition: service_healthy
