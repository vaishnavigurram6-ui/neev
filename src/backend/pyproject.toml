[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neev-backend"
version = "0.1.0"
description = "Neev application backend. Serves the ADK pipeline live, or replays a recorded run in fixture mode."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
# What NEEV_MODE=live needs. An extra rather than a hard dependency: fixture
# mode imports none of it -- every ADK import in app/services/live_runner.py is
# inside the method body -- so a deployment that only replays recorded runs can
# still install the backend without pulling ADK and its transitive tree.
live = ["neev-pipeline"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
